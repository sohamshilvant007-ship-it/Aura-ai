name = "aura-backend"
main = "worker.js"
compatibility_date = "2024-01-01"

# Cloudflare Workers AI binding - Gemini fail hone par isse fallback milega
# koi extra API key nahi chahiye, Cloudflare free tier deta hai
[ai]
binding = "AI"

# GEMINI_API_KEY yahan mat likho - Cloudflare dashboard mein
# Settings -> Variables and Secrets mein "Secret" ki tarah add karo
